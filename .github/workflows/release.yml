name: Release Builds (Windows & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: src-tauri
          tauriScript: tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "HeddleLab v__VERSION__"
          releaseBody: |
            ### Downloads
            - **Windows (64-Bit):** `HeddleLab_x.x.x_x64-setup.exe` (oder `.msi`)
            - **macOS (Apple Silicon & Intel Universal):** `HeddleLab_x.x.x_universal.dmg`

            ### Hinweis für macOS (erster Start ohne Apple-Developer-Zertifikat)
            1. Ziehe `HeddleLab.app` aus dem `.dmg` in deinen **Programme**-Ordner.
            2. Öffne die App einmal (bei Warnung: **Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen“**).
            3. Falls macOS *„beschädigt“* meldet, führe einmalig im Terminal aus:
               ```bash
               xattr -cr /Applications/HeddleLab.app
               ```
            Danach funktioniert auch der eingebaute **1-Klick-Auto-Updater** direkt in der App!
          releaseDraft: false
          prerelease: false
