[package]
name = "weben-planer"
version = "0.1.0"
description = "Handweb-Planer für Gatterkamm- und Schaftwebstühle"
authors = ["Weben Planer"]
edition = "2021"

[lib]
name = "weben_planer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
