[package]
name = "heddlelab"
version = "0.2.1"
description = "Handweb-Studio für Gatterkamm- und Schaftwebstühle"
authors = ["Patrick Barbian"]
edition = "2021"

[lib]
name = "heddlelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
